{% extends "base.html" %}
{% load static %}

{% block title %}Register Item - CIT-U Lost & Found{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/item.css' %}">
{% endblock %}

{% block content %}
    <div class="item-container">
        <div class="item-header">
            <h1><i class="fas fa-plus-circle"></i> Register Found Item</h1>
        </div>

        <form method="POST" class="register-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="itemname"><i class="fas fa-tag"></i> Item Name</label>
                <input type="text" id="itemname" name="itemname" required>
            </div>

            <div class="form-group">
                <label for="itemdescription"><i class="fas fa-align-left"></i> Description</label>
                <textarea id="itemdescription" name="itemdescription" required></textarea>
            </div>

            <div class="form-group">
                <label for="categoryid"><i class="fas fa-folder"></i> Category</label>
                <select id="categoryid" name="categoryid" required>
                    {% for category in categories %}
                        <option value="{{ category.pk }}">{{ category.categoryname }}</option>
                    {% endfor %}
                </select>
                <button type="button" class="add-button" onclick="window.open('{% url 'register_category' %}', '_blank')">
                    <i class="fas fa-plus"></i> Add Category
                </button>
            </div>

            <div class="form-group">
                <label for="locationid"><i class="fas fa-map-marker-alt"></i> Location</label>
                <select id="locationid" name="locationid" required>
                    {% for location in locations %}
                        <option value="{{ location.pk }}">{{ location.building }} - Floor {{ location.floor }}</option>
                    {% endfor %}
                </select>
                <button type="button" class="add-button" onclick="window.open('{% url 'register_location' %}', '_blank')">
                    <i class="fas fa-plus"></i> Add Location
                </button>
            </div>

            <!-- Toggle between Found and Lost -->
            <div class="form-buttons">
                <button type="button" class="add-button" onclick="window.location.href='{% url 'report_lost_item' %}'">
                    <i class="fas fa-search"></i> Report Lost Item Instead
                </button>
            </div>

            <div class="form-buttons">
                <button type="submit">
                    <i class="fas fa-save"></i> Register Item
                </button>
                <a href="{% url 'manage_inventory' %}" class="cancel-button">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>


{% endblock %}
